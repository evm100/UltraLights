# Installed to /etc/mosquitto/conf.d/ultralights.conf by deploy/install.sh.
# The ACL is installed to /etc/mosquitto/ultralights.acl; the TLS files under /etc/mosquitto/certs/ultralights/
# are copied there by ultralights-broker-sync (server certificate from Let's Encrypt, device CA
# chain and CRL from /etc/ultralights/pki). Both paths are ones Ubuntu's AppArmor profile for
# Mosquitto already allows (/etc/mosquitto/* and /etc/mosquitto/certs/**); a subdirectory of our
# own such as /etc/mosquitto/ultralights/ is denied, whatever its file permissions.
#
# The host broker may also serve other projects from their own conf.d files. Mosquitto then runs
# with per_listener_settings true (install.sh checks this), so every security option below sits
# after our listener line: placed before it, it would attach to whichever listener the previous
# file left open. On a broker that serves only us, the same options simply apply globally.

listener 8883
allow_anonymous false
acl_file /etc/mosquitto/ultralights.acl
certfile /etc/mosquitto/certs/ultralights/server.crt
keyfile /etc/mosquitto/certs/ultralights/server.key
cafile /etc/mosquitto/certs/ultralights/ca-chain.crt
crlfile /etc/mosquitto/certs/ultralights/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

max_inflight_messages 40
max_queued_messages 200
