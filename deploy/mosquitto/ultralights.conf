# Installed to /etc/mosquitto/conf.d/ultralights.conf by deploy/install.sh.
# Files under /etc/mosquitto/ultralights/ are copied there by ultralights-broker-sync
# (server certificate from Let's Encrypt, device CA chain and CRL from /etc/ultralights/pki).

allow_anonymous false
acl_file /etc/mosquitto/ultralights/acl

listener 8883
certfile /etc/mosquitto/ultralights/server.crt
keyfile /etc/mosquitto/ultralights/server.key
cafile /etc/mosquitto/ultralights/ca-chain.crt
crlfile /etc/mosquitto/ultralights/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

max_inflight_messages 40
max_queued_messages 200
